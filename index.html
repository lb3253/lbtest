<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC Refresh Lookup</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Theme Color for Browser UI -->
    <meta name="theme-color" content="#ff1a57">

    <!-- iOS Status Bar Style -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PC Refresh">

    <!-- Description -->
    <meta name="description" content="PC Refresh asset serial number verification tool with barcode scanning">

    <link rel="stylesheet" href="styles.css">
    <!-- html5-qrcode library for barcode scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- SheetJS for Excel file parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>PC Refresh Lookup</h1>
            <p class="subtitle">Asset Serial Number Verification</p>
        </header>

        <!-- Excel File Upload Section -->
        <div class="card">
            <h2>1. Upload Serial Numbers</h2>
            <div class="upload-section">
                <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" />
                <label for="excelFile" class="upload-btn">Choose Excel File</label>
                <div id="uploadStatus" class="status-message"></div>
                <button id="clearStorageBtn" class="btn-clear" style="display: none;" onclick="clearStoredData()">Clear Stored Data</button>
            </div>
        </div>

        <!-- Barcode Scanner Section -->
        <div class="card">
            <h2>2. Scan Label</h2>
            <p class="scan-description">Point at the label — the scanner will read all barcodes and automatically find the serial number.</p>
            <div class="scanner-controls">
                <button id="startScanBtn" class="btn btn-primary" disabled>Start Scanner</button>
                <button id="stopScanBtn" class="btn btn-secondary" style="display: none;">Stop Scanner</button>
            </div>
            <div id="reader" class="scanner-container"></div>
        </div>

        <!-- Manual Entry Option -->
        <div class="card">
            <h2>3. Or Enter Manually</h2>
            <div class="manual-entry">
                <input type="text" id="manualInput" placeholder="Enter serial number" disabled />
                <button id="checkBtn" class="btn btn-primary" disabled>Check</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsCard" class="card results-card" style="display: none;">
            <h2>Result</h2>
            <div id="resultContent"></div>
        </div>

        <!-- Serial Numbers List -->
        <div id="serialListCard" class="card" style="display: none;">
            <h2>Loaded Serial Numbers</h2>
            <div class="serial-count" id="serialCount"></div>
            <div class="serial-list" id="serialList"></div>
        </div>

        <!-- Scan History -->
        <div id="historyCard" class="card" style="display: none;">
            <h2>Scan History</h2>
            <div class="history-count" id="historyCount"></div>
            <div class="history-actions">
                <button onclick="exportScanHistory()" class="btn-history">Export CSV</button>
                <button onclick="clearScanHistory()" class="btn-history btn-history-clear">Clear History</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
