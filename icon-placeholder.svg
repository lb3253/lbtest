<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#f1f1f1"/>

  <!-- Computer Monitor -->
  <rect x="120" y="150" width="220" height="160" rx="8" fill="#333333" stroke="#000000" stroke-width="4"/>
  <rect x="130" y="160" width="200" height="130" fill="#0091da"/>

  <!-- Monitor Stand -->
  <rect x="200" y="310" width="60" height="40" fill="#333333"/>
  <rect x="170" y="350" width="120" height="12" rx="6" fill="#333333"/>

  <!-- Magnifying Glass -->
  <circle cx="360" cy="280" r="60" fill="none" stroke="#ff1a57" stroke-width="12"/>
  <circle cx="360" cy="280" r="45" fill="rgba(255, 26, 87, 0.1)"/>
  <line x1="405" y1="325" x2="445" y2="365" stroke="#ff1a57" stroke-width="12" stroke-linecap="round"/>

  <!-- Recycle Symbol (in circle badge) -->
  <circle cx="150" cy="120" r="45" fill="#28a745"/>
  <g transform="translate(150, 120)">
    <!-- Simplified recycle arrows -->
    <path d="M -15,-20 L -5,-10 L -15,0 M -5,-10 L 10,-10" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 15,0 L 5,10 L 15,20 M 5,10 L -10,10" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-15 L 0,15" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
