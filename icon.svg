<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#ff1a57"/>

  <!-- Computer Monitor -->
  <rect x="96" y="120" width="220" height="165" rx="12" fill="#ffffff"/>
  <rect x="108" y="132" width="196" height="130" rx="4" fill="#2d2d2d"/>

  <!-- Screen content - scan lines -->
  <rect x="124" y="155" width="80" height="6" rx="3" fill="#4ade80" opacity="0.8"/>
  <rect x="124" y="170" width="120" height="6" rx="3" fill="#4ade80" opacity="0.5"/>
  <rect x="124" y="185" width="60" height="6" rx="3" fill="#4ade80" opacity="0.6"/>
  <rect x="124" y="200" width="100" height="6" rx="3" fill="#4ade80" opacity="0.4"/>
  <rect x="124" y="215" width="75" height="6" rx="3" fill="#4ade80" opacity="0.7"/>

  <!-- Checkmark on screen -->
  <path d="M260 180 L275 200 L310 158" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Monitor chin -->
  <rect x="96" y="272" width="220" height="13" rx="0 0 12 12" fill="#e8e8e8"/>

  <!-- Monitor Stand -->
  <rect x="186" y="285" width="40" height="30" fill="#cccccc"/>
  <rect x="156" y="312" width="100" height="14" rx="7" fill="#cccccc"/>

  <!-- Magnifying Glass -->
  <g transform="translate(340, 290)">
    <!-- Glass handle -->
    <line x1="32" y1="32" x2="75" y2="75" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <!-- Glass ring outer -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#ffffff" stroke-width="16"/>
    <!-- Glass fill -->
    <circle cx="0" cy="0" r="50" fill="rgba(255,255,255,0.15)"/>
    <!-- Glass shine -->
    <path d="M -25,-35 Q -35,-20 -35,-5" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
